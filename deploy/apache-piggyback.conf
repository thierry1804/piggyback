# Configuration Apache pour Piggyback (SPA sous /piggyback/)
# Le .htaccess est souvent ignoré (AllowOverride None ou Alias).
# Inclure ce bloc dans le VirtualHost qui sert haythi.mg.
#
# 1. Trouver le chemin physique qui sert /piggyback/ (ex. /home/ubuntu/pback)
# 2. Adapter <Directory /home/ubuntu/pback> ci-dessous
# 3. Soit inclure ce fichier : Include /chemin/vers/deploy/apache-piggyback.conf
#    Soit copier le bloc <Directory> dans le vhost (ex. /etc/apache2/sites-available/haythi.conf)
# 4. Tester : sudo apache2ctl configtest
# 5. Recharger : sudo systemctl reload apache2

<Directory /home/ubuntu/pback>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Fallback SPA : tout chemin qui n'est pas un fichier/dossier → index.html
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [QSA,L]
    </IfModule>
</Directory>
